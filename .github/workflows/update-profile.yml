name: Update Profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Dynamic README
        uses: umutphp/github-action-dynamic-profile-page@v1.3.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells the action to read from the template and write to the real README
          README_TEMPLATE: "README.md.template"
          README_FILE: "README.md"
