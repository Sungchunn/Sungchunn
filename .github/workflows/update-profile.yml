name: Update Profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Dynamic README
        uses: umutphp/github-action-dynamic-profile-page@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The correct parameter name for this action is 'TEMPLATE'
          TEMPLATE: "README.md.template"
